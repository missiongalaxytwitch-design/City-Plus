name: CityPlus 1.21.11 dependency cache helper
on:
  push:
    branches: [forward-port-1.21.11]
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Create exact 1.21.11 probe
        shell: bash
        run: |
          mkdir -p probe/src/main/java/probe probe/src/main/resources
          cat > probe/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'cityplus-12111-cache-probe'
          EOF
          cat > probe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.configuration-cache=false
          minecraft_version=1.21.11
          loader_version=0.19.3
          loom_version=1.17-SNAPSHOT
          fabric_api_version=0.141.6+1.21.11
          EOF
          cat > probe/build.gradle <<'EOF'
          plugins {
              id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
          }
          repositories {
              mavenCentral()
              maven { url = 'https://api.modrinth.com/maven' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${minecraft_version}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:${loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
              modCompileOnly "maven.modrinth:N6n5dqoA:DLVQrqv2"
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF
          cat > probe/src/main/java/probe/Probe.java <<'EOF'
          package probe;
          public final class Probe {}
          EOF
          cat > probe/src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"cityplus_cache_probe","version":"1.0.0","name":"probe","environment":"client","depends":{"fabricloader":">=0.19.3","minecraft":"1.21.11","java":">=21"}}
          EOF
      - name: Resolve Loom Minecraft Fabric Axiom stack
        working-directory: probe
        run: gradle clean build --no-daemon --stacktrace
      - name: Package resolved Gradle cache
        shell: bash
        run: |
          mkdir -p artifact
          tar -C "$HOME/.gradle" -czf artifact/gradle-caches-12111.tar.gz caches
          if [ -d probe/.gradle ]; then tar -C probe -czf artifact/project-gradle-12111.tar.gz .gradle; fi
          find "$HOME/.gradle/caches" -type f | sed "s#$HOME/.gradle/caches/##" | sort > artifact/cache-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cityplus-1.21.11-resolved-cache
          path: artifact
          if-no-files-found: error
