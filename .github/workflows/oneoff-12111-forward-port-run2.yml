name: One-off CityPlus 1.21.11 forward port run2

on:
  push:
    branches:
      - forward-port-1.21.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Recover source and diagnose
        id: recover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p work artifact
          curl -sS -D artifact/blob-headers.txt -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/38bc83542508c4796ff956a7cee53fc487d4deab" -o artifact/blob-response.json
          curl_rc=$?
          python - <<'PY'
          import json,base64,pathlib
          p=pathlib.Path('artifact/blob-response.json')
          try:
              o=json.loads(p.read_text())
              pathlib.Path('artifact/blob-summary.txt').write_text('keys='+','.join(o.keys())+'\nencoding='+str(o.get('encoding'))+'\nsize='+str(o.get('size'))+'\nmessage='+str(o.get('message'))+'\n')
              c=o.get('content')
              if c: pathlib.Path('/tmp/cityplus.tar.xz').write_bytes(base64.b64decode(c))
          except Exception as e:
              pathlib.Path('artifact/blob-summary.txt').write_text('parse_error='+repr(e)+'\n')
          PY
          echo "curl_rc=${curl_rc}" >> artifact/blob-summary.txt
          ls -l /tmp/cityplus.tar.xz >> artifact/blob-summary.txt 2>&1
          xz -t /tmp/cityplus.tar.xz >> artifact/blob-summary.txt 2>&1
          xz_rc=$?
          echo "xz_rc=${xz_rc}" >> artifact/blob-summary.txt
          if [ "$xz_rc" = 0 ]; then tar -xJf /tmp/cityplus.tar.xz -C work; fi
          if test -f work/build.gradle; then echo ok > artifact/recover-ok.txt; else echo failed > artifact/recover-ok.txt; fi
          exit 0
      - name: Build and capture log
        id: build
        shell: bash
        run: |
          set +e
          if [ ! -f work/build.gradle ]; then echo SOURCE_RECOVERY_FAILED | tee forward-port-build.log; echo "exit_code=98" >> "$GITHUB_OUTPUT"; exit 0; fi
          cd work
          gradle build --stacktrace --no-daemon 2>&1 | tee ../forward-port-build.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Collect diagnostics and JARs
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp forward-port-build.log artifact/ || true
          cp work/gradle.properties artifact/ || true
          cp work/build.gradle artifact/ || true
          cp work/src/main/resources/fabric.mod.json artifact/fabric.mod.json.source 2>/dev/null || true
          cp -r work/build/libs artifact/libs 2>/dev/null || true
          find work/build -maxdepth 5 -type f | sort > artifact/build-files.txt 2>/dev/null || true
          echo "${{ steps.build.outputs.exit_code }}" > artifact/build-exit-code.txt
      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cityplus-1.21.11-forward-port-run2
          path: artifact
          if-no-files-found: error
      - name: Fail if compilation failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
