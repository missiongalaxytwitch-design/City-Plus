name: Resolve CityPlus 1.20.1 Legacy Loom Cache 20260813

on:
  push:
    paths:
      - '.github/workflows/resolve-cityplus-1201-legacyloom-20260813.yml'
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Create Minecraft 1.20.1 Fabric probe
        run: |
          mkdir -p probe/src/main/java/dev/riley/probe probe/src/main/resources
          cat > probe/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'cityplus-1201-legacy-probe'
          EOF
          cat > probe/build.gradle <<'EOF'
          plugins {
              id 'fabric-loom' version '1.2.1'
          }
          repositories { mavenCentral() }
          dependencies {
              minecraft 'com.mojang:minecraft:1.20.1'
              mappings loom.officialMojangMappings()
              modImplementation 'net.fabricmc:fabric-loader:0.18.4'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.8+1.20.1'
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 17 }
          java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          EOF
          cat > probe/src/main/java/dev/riley/probe/Probe.java <<'EOF'
          package dev.riley.probe;
          import net.minecraft.core.BlockPos;
          public final class Probe { public static BlockPos origin(){ return BlockPos.ZERO; } }
          EOF
          cat > probe/src/main/resources/fabric.mod.json <<'EOF'
          {"schemaVersion":1,"id":"cityplus_cache_probe","version":"1","environment":"client","entrypoints":{},"depends":{"fabricloader":">=0.18.4","minecraft":"1.20.1","java":">=17"}}
          EOF
      - name: Resolve and compile probe
        id: probe
        continue-on-error: true
        working-directory: probe
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean classes 2>&1 | tee ../probe-build.log
      - name: Bundle installed Gradle and resolved cache
        if: always()
        run: |
          mkdir -p artifact
          cp -R "$(dirname $(dirname $(readlink -f $(command -v gradle))))" artifact/gradle
          cp -R "$HOME/.gradle/caches" artifact/caches
          cp probe-build.log artifact/probe-build.log || true
          echo "probe_outcome=${{ steps.probe.outcome }}" > artifact/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cityplus-1.20.1-legacyloom-buildkit
          path: artifact
          retention-days: 7
      - name: Require probe success
        if: steps.probe.outcome != 'success'
        run: exit 1
